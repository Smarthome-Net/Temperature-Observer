name: Temperature Observer Build


on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      BINARY_NAME: temperature_observer
    steps:
      
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Build Source
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.4
        target: esp32

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: $BINARY_NAME.bin 
        path: |
          build/$BINARY_NAME.bin
    
