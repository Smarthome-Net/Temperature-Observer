# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
  - task: Bash@3
    displayName: 'Esp Git Checkout'
    inputs:
      targetType: 'inline'
      script: |
        mkdir -p ~/esp
        cd ~/esp
        git clone -b v5.2.1 --recursive https://github.com/espressif/esp-idf.git
  - task: Bash@3
    displayName: 'Esp Install'
    inputs:
      workingDirectory: 'esp/esp-idf'
      targetType: 'inline'
      script: 
        ./install.sh esp32